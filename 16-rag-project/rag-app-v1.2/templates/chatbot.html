<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="chat-body">

  <div class="chat-header">
    <span class="pulse-dot"></span>
    <h1>Medical Chatbot</h1>
    <span class="sub">RAG-GROUNDED</span>
  </div>

  <div class="chat-log" id="chatLog">
    <div class="msg bot">
      <p>Hi — I can answer general medical questions using a reference knowledge base. What would you like to ask?</p>
    </div>
  </div>

  <div class="chat-input-row">
    <textarea id="chatInput" placeholder="Ask a medical question…" rows="1"></textarea>
    <button id="sendBtn">Send</button>
  </div>
  <p class="chat-footnote">General information only — not a substitute for professional medical advice.</p>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
